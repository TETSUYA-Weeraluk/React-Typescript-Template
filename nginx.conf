server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # security headers พื้นฐาน — ปรับ CSP ตาม domain ของ API จริงก่อนเปิดใช้
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.example.com" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # index.html ห้าม cache — หลัง deploy ผู้ใช้ต้องได้ไฟล์ใหม่ที่ชี้ไป asset ชุดใหม่
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ไฟล์ใน /assets มี hash ในชื่อ เปลี่ยนเนื้อหา = เปลี่ยนชื่อ จึง cache ได้ 1 ปี
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: path ที่ไม่ใช่ไฟล์จริงให้ index.html (TanStack Router จัดการต่อ)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
